<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>iPhone Use</title>
  <defs>
    <linearGradient id="tile" x1="84" y1="24" x2="408" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7f9"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e2e9ed" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="rear" x1="154" y1="78" x2="300" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64efb1"/>
      <stop offset=".45" stop-color="#0ddc86"/>
      <stop offset="1" stop-color="#00b978"/>
    </linearGradient>
    <linearGradient id="glass" x1="218" y1="138" x2="358" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9eefff" stop-opacity=".88"/>
      <stop offset=".45" stop-color="#16c9f4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0784eb" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="glass-rim" x1="210" y1="138" x2="364" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#e8ffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#70cfff" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="reflection" cx="0" cy="0" r="1" gradientTransform="translate(224 134) rotate(58) scale(232 115)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="210" y1="144" x2="370" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="front-clip">
      <rect x="200" y="138" width="174" height="296" rx="36"/>
    </clipPath>
    <filter id="tile-shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#253c49" flood-opacity=".12"/>
    </filter>
    <filter id="rear-shadow" x="108" y="58" width="234" height="356" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#009568" flood-opacity=".23"/>
    </filter>
    <filter id="glass-shadow" x="176" y="122" width="226" height="346" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0879a6" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="117" fill="url(#tile)" stroke="url(#rim)" stroke-width="2" filter="url(#tile-shadow)"/>
  <rect x="138" y="78" width="174" height="296" rx="34" fill="url(#rear)" filter="url(#rear-shadow)"/>
  <rect x="139.5" y="79.5" width="171" height="293" rx="32.5" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="2"/>
  <rect x="200" y="138" width="174" height="296" rx="36" fill="url(#glass)" stroke="url(#glass-rim)" stroke-width="3.5" filter="url(#glass-shadow)"/>
  <g clip-path="url(#front-clip)">
    <rect x="200" y="138" width="174" height="296" fill="url(#reflection)"/>
    <path d="M200 138H374V212C304 225 251 263 200 297Z" fill="url(#sheen)"/>
  </g>
  <rect x="203.5" y="141.5" width="167" height="289" rx="32.5" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
  <rect x="255" y="411" width="64" height="7" rx="3.5" fill="#fff" fill-opacity=".78"/>
</svg>
